
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elena & Juan | Nuestra Boda</title>

    <link rel="stylesheet" href="assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <header class="hero">
        <div class="hero-content">
            <p>¡NOS CASAMOS!</p>
            <h1>Elena & Juan</h1>
            <span>19 · Diciembre · 2026</span>
        </div>
    </header>

    <main>

        <section id="bienvenida" class="section">
            <h2>Un día especial</h2>
            <p>
                Nos encantaría compartir contigo
                uno de los días más importantes
                de nuestras vidas.
            </p>
        </section>

        <section id="contador" class="section">
            <h2>Cuenta regresiva</h2>
            <div id="countdown"></div>
        </section>

        <section id="ceremonia" class="section">
            <h2>Ceremonia religiosa</h2>
            <div id="ubicacion-iglesia"></div>
        </section>

        <section id="recepcion" class="section">
            <h2>Recepción</h2>
            <div id="ubicacion-recepcion"></div>
        </section>

        <section id="dresscode" class="section">
            <h2>Código de vestimenta</h2>
            <div id="dresscode-content"></div>
        </section>

        <section id="regalos" class="section">
            <h2>Mesa de regalos</h2>
            <div id="regalos-content"></div>
        </section>

    </main>

    <script src="assets/js/main.js"></script>

</body>
</html>
