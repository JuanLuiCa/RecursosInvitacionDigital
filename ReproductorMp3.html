<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Material+Symbols+Outlined" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:transparent;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Botón */

.player{

    display:flex;
    align-items:center;
    gap:12px;

    background:#fff;
    border-radius:50px;
    padding:10px 16px;

    /* QUITAR SOMBRA */
    box-shadow:none;

    cursor:pointer;
    user-select:none;

}

#play{

width:55px;
height:55px;

border:none;

border-radius:50%;

background:#b8895f;

color:#fff;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

}

.material-symbols-outlined{

font-size:32px;

}

.texto{

display:flex;
flex-direction:column;
align-items:flex-start;

}

.titulo{

font-family:'Great Vibes',cursive;

font-size:28px;

color:#b8895f;

}

.sub{

font-size:12px;

letter-spacing:1px;

color:#777;

}

@media(max-width:480px){

.player{

right:10px;
bottom:10px;

padding:8px 12px;

}

#play{

width:48px;
height:48px;

}

.material-symbols-outlined{

font-size:28px;

}

.titulo{

font-size:22px;

}

.sub{

font-size:11px;

}

}

</style>

</head>

<body>

<div class="player">

<button id="play">

<span class="material-symbols-outlined">

play_arrow

</span>

</button>

<div class="texto">

<div class="titulo">

Nuestra canción

</div>

<div class="sub">

Toca para escuchar

</div>

</div>

</div>

<audio id="audio" loop>

<source src="https://juanluica.github.io/RecursosInvitacionDigital/DVICIO%20-%20Casi%20humanos%20(Piano%20Cover)%20%20Iker%20Estalayo.mp3" type="audio/mpeg">

</audio>

<script>

const audio=document.getElementById("audio");

const boton=document.getElementById("play");

const icono=boton.querySelector("span");

boton.addEventListener("click",()=>{

if(audio.paused){

audio.play();

icono.textContent="pause";

}else{

audio.pause();

icono.textContent="play_arrow";

}

});

</script>

</body>
</html>
