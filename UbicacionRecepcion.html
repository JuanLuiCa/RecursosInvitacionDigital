<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:transparent;
    padding:20px;
    display:flex;
    justify-content:center;

    font-family:'Cormorant Garamond',serif;

}

.card{

    width:100%;
    max-width:420px;

    background:#fff;

    border-radius:22px;

    border:1px solid #eadccf;

    padding:28px 24px;

    text-align:center;

}

.icono{

    font-size:40px;

}

.titulo{

    font-family:'Great Vibes',cursive;

    font-size:40px;

    color:#b8895f;

    margin-top:10px;

}

.nombre{

    margin-top:15px;

    font-size:28px;

    font-weight:600;

}

.direccion{

    margin-top:10px;

    color:#666;

    font-size:20px;

    line-height:1.5;

}

.boton{

    display:inline-block;

    margin-top:25px;

    padding:14px 28px;

    background:#b8895f;

    color:white;

    text-decoration:none;

    border-radius:40px;

    font-size:18px;

    transition:.3s;

}

.boton:hover{

background:#a5784f;

}

@media(max-width:480px){

.titulo{

font-size:34px;

}

.nombre{

font-size:24px;

}

.direccion{

font-size:18px;

}

.boton{

width:100%;

}

}

</style>

</head>

<body>

<div class="card">

<div class="icono">
  <span class="material-symbols-outlined">
  wine_bar
  </span>
</div>

<div class="titulo">
Recepción
</div>

<div class="nombre">
Salón Casa del Jubilado
</div>

<div class="direccion">
Manuel Acuña, Centro<br>
San Pedro, Coah.
</div>

<div class="direccion">
8:30 p.m.
</div>

<a
class="boton"
href="https://maps.app.goo.gl/cGjawnd4xzPFP5qv8"
target="_blank">

Ver ubicación

</a>

</div>

</body>
</html>
