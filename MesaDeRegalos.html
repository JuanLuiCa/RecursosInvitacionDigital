<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tipografías -->
<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap"
    rel="stylesheet"
>

<!-- Material Symbols -->
<link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    margin:0;
    padding:20px 15px;

    background:transparent;

    font-family:'Cormorant Garamond', serif;
    color:#222;

    text-align:center;

    overflow-x:hidden;
}


/* =========================
   CONTENEDOR
========================= */

.dress-code{
    width:100%;
    max-width:600px;

    margin:0 auto;
    padding:20px 10px;
}


/* =========================
   ICONO PRINCIPAL
========================= */

.icono-principal{
    display:block;

    font-size:48px;
    color:#b8895f;

    font-variation-settings:
        'FILL' 0,
        'wght' 250,
        'GRAD' 0,
        'opsz' 48;
}


/* =========================
   TÍTULO
========================= */

.titulo{
    margin-top:8px;

    font-family:'Great Vibes', cursive;
    font-size:clamp(38px, 7vw, 48px);
    font-weight:400;

    color:#b8895f;
}


/* =========================
   TIPO DE VESTIMENTA
========================= */

.etiqueta{
    margin-top:20px;

    font-size:14px;
    letter-spacing:3px;

    color:#888;
}

.tipo{
    margin-top:4px;

    font-size:clamp(28px, 5vw, 34px);
    font-weight:600;
}


/* =========================
   OPCIONES HOMBRE / MUJER
========================= */

.opciones{
    display:flex;

    justify-content:center;
    align-items:flex-start;

    gap:clamp(30px, 10vw, 80px);

    margin-top:30px;
}

.opcion{
    flex:1;

    max-width:180px;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* ICONOS */

.icono-vestimenta{
    font-size:68px;

    color:#b8895f;

    font-variation-settings:
        'FILL' 0,
        'wght' 200,
        'GRAD' 0,
        'opsz' 48;
}


/* HOMBRE / MUJER */

.opcion-titulo{
    margin-top:8px;

    font-size:14px;
    letter-spacing:2px;

    color:#888;
}


/* DESCRIPCIÓN */

.opcion-texto{
    margin-top:4px;

    font-size:20px;
    font-weight:600;
}


/* =========================
   DIVISOR
========================= */

.divisor{
    width:70px;
    height:1px;

    margin:30px auto;

    background:#d8c1aa;
}


/* =========================
   COLOR RESERVADO
========================= */

.reservado-titulo{
    font-size:20px;
    font-weight:600;
}


/* CÍRCULO BLANCO */

.color-novia{
    width:58px;
    height:58px;

    margin:16px auto 10px;

    background:#ffffff;

    border:1px solid #ccc;

    border-radius:50%;
}


/* NOMBRE DEL COLOR */

.color-nombre{
    font-size:22px;
    font-weight:600;
}


/* NOTA */

.nota{
    max-width:380px;

    margin:8px auto 0;

    font-size:17px;
    line-height:1.4;

    color:#777;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:480px){

    body{
        padding:15px 10px;
    }

    .dress-code{
        padding:15px 5px;
    }

    .icono-principal{
        font-size:42px;
    }

    .opciones{
        gap:25px;
    }

    .icono-vestimenta{
        font-size:58px;
    }

    .opcion-titulo{
        font-size:12px;
    }

    .opcion-texto{
        font-size:18px;
    }

    .reservado-titulo{
        font-size:18px;
    }

    .nota{
        font-size:16px;
    }

}

</style>

</head>


<body>


<section class="dress-code">

	<!-- TÍTULO -->

    <h2 class="titulo">
        Mesa de Regalos
    </h2>
    
    <div class="etiqueta">
        Tu presencia es nuestro mejor regalo, pero si deseas obsequiarnos algo, puedes hacerlo de la siguiente forma:
    </div>

    <div class="opciones">

        <div class="opcion">

            <span class="material-symbols-outlined icono-vestimenta">
            featured_seasonal_and_gifts
            </span>
        </div>

        <div class="opcion">

            <span class="material-symbols-outlined icono-vestimenta">
                mail
            </span>
        </div>


    </div>

</section>


</body>
</html>
